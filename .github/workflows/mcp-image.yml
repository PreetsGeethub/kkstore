name: MCP Image

on:
  push:
    branches:
      - experiment/kkstore-mcp
    paths:
      - "mcp-server/**"
      - ".github/workflows/mcp-image.yml"

  pull_request:
    branches:
      - experiment/kkstore-mcp
    paths:
      - "mcp-server/**"
      - ".github/workflows/mcp-image.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: mcp-server
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run automated tests
        working-directory: mcp-server
        run: python -m pytest -v

      - name: Compile Python source
        working-directory: mcp-server
        run: python -m compileall -q server.py client.py

  publish:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ./mcp-server
          push: true
          tags: |
            ghcr.io/preetsgeethub/kkstore-mcp:latest
            ghcr.io/preetsgeethub/kkstore-mcp:${{ github.sha }}